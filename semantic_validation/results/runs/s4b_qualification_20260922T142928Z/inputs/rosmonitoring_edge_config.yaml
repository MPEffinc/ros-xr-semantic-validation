monitors:
  - monitor:
      id: s4b_custom_guard
      log: /results/rosmonitoring/humble/edge_logs_03/custom_events.jsonl
      status: {enabled: true, log: /results/rosmonitoring/humble/edge_logs_03/custom_status.jsonl}
      oracle: {url: 127.0.0.1, port: 18765, timeout: 0.05, action: nothing}
      topics:
        - {name: s4b_custom, type: teleop_bridge_msgs.msg.ReceivedPoseStates, action: filter, publishers: [source]}
  - monitor:
      id: s4b_absent_guard
      log: /results/rosmonitoring/humble/edge_logs_03/absent_events.jsonl
      status: {enabled: true, log: /results/rosmonitoring/humble/edge_logs_03/absent_status.jsonl}
      oracle: {url: 127.0.0.1, port: 18766, timeout: 0.05, action: nothing}
      topics:
        - {name: s4b_absent, type: std_msgs.msg.String, action: filter, publishers: [source]}
  - monitor:
      id: s4b_disconnect_guard
      log: /results/rosmonitoring/humble/edge_logs_03/disconnect_events.jsonl
      status: {enabled: true, log: /results/rosmonitoring/humble/edge_logs_03/disconnect_status.jsonl}
      oracle: {url: 127.0.0.1, port: 18767, timeout: 0.05, action: nothing}
      topics:
        - {name: s4b_disconnect, type: std_msgs.msg.String, action: filter, publishers: [source]}
  - monitor:
      id: s4b_hang_guard
      log: /results/rosmonitoring/humble/edge_logs_03/hang_events.jsonl
      status: {enabled: true, log: /results/rosmonitoring/humble/edge_logs_03/hang_status.jsonl}
      oracle: {url: 127.0.0.1, port: 18768, timeout: 0.05, action: nothing}
      topics:
        - {name: s4b_hang, type: std_msgs.msg.String, action: filter, publishers: [source]}
